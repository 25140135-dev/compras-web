
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El ideal de Aquiles</title>

    <style>
        body {
            background-color: #93de82;
            font-family: Georgia, 'Times New Roman', serif;
            color: #1c0303;
            margin: 0;
        }

        header {
            background-color: #309476;
            color: #030800;
            padding: 50px 20px 40px;
            text-align: center;
        }

        header h1 {
            font-size: 2.6rem;
            color: #1c0303;
        }

        header p {
            color: #c9a24b;
            font-style: italic;
            margin: 0;
        }

        section {
            background-color: #63cdb4;
            max-width: 900px;
            margin: 30px auto;
            padding: 25px 30px;
        }

        h2 {
            color: #14304a;
            border-bottom: 1px solid #c9a24b;
            padding-bottom: 8px;
            text-align: center;
        }

        p {
            text-align: center;
        }

        .galeria {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
        }

        .imagen {
            width: 250px;
            text-align: center;
        }

        .imagen img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .imagen p {
            text-align: center;
        }

        @media (max-width: 600px) {
            section {
                margin: 20px 12px;
                padding: 20px;
            }

            .imagen {
                width: 100%;
                max-width: 350px;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Snack Saludabes</h1>
        <p>by ECOFOOD</p>
    </header>

    <section>
        <h2>Nuestros Productos</h2>

        <div class="galeria">

            <div class="imagen">
                <a href="https://25140135-dev.github.io/barras/">
                    <img src="img-1.jpeg" alt="Imagen 5">
                <p>Barritas de platano con avena.</p>
              </a>
            </div>

            <div class="imagen">
                <a href="https://25140135-dev.github.io/Manzana/">
                    <img src="img-2.jpeg" alt="Imagen 5">
                <p>Manzana seca con canela.</p>
              </a>
            </div>

            <div class="imagen">
               <a href="https://25140135-dev.github.io/gomitas/">
                    <img src="img-3.jpeg" alt="Imagen 5">
                <p>Gomitas de maracuya y mango.</p>
              </a>
            </div>

            <div class="imagen">
                <a href="https://25140135-dev.github.io/Rollitos/">
                    <img src="img-4.jpeg" alt="Imagen 5">
                <p>Rollitos de fruta seca.</p>
              </a>
            </div>

            <div class="imagen">
              <a href="https://25140135-dev.github.io/camote/">
                    <img src="img-5.jpeg" alt="Imagen 5">
                <p>Chips de Camote.</p>
              </a>
                
            </div>

        </div>
    </section>

</body>
</html>
